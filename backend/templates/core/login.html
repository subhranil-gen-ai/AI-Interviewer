{% extends "core/base.html" %}
{% block title %}Sign In – AI Interviewer{% endblock %}
{% block content %}
<div class="max-w-md mx-auto glass-card p-8 rounded-2xl shadow-2xl mt-8">
  <div class="mb-6 text-center">
    <h1 class="text-2xl font-bold text-white">Welcome Back</h1>
    <p class="text-sm text-slate-400 mt-1">Sign in to access your AI Interview Dashboard or Recruiter Portal.</p>
  </div>

  <form method="POST" action="{% url 'login' %}" class="space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Username</label>
      <input type="text" name="username" required placeholder="Enter your username" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:border-indigo-500 focus:outline-none" />
    </div>
    <div>
      <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1.5">Password</label>
      <input type="password" name="password" required placeholder="••••••••" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-sm focus:border-indigo-500 focus:outline-none" />
    </div>
    <button type="submit" class="w-full py-3 rounded-xl font-semibold text-white gradient-brand shadow-lg shadow-indigo-600/30 hover:opacity-95 transition">
      Sign In
    </button>
  </form>

  <p class="text-xs text-center text-slate-400 mt-6">
    New to AI Interviewer? <a href="{% url 'register' %}" class="text-indigo-400 hover:underline font-semibold">Register an account</a>
  </p>
</div>
{% endblock %}
